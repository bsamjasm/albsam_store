name: Build iOS App
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pods and Build Workspace
        run: |
          cd src
          pod install
          cd ..

          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          WORKSPACE_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)

          echo "Building workspace: $WORKSPACE_PATH"
          xcodebuild -workspace "$WORKSPACE_PATH" -scheme "$WORKSPACE_NAME" -sdk iphoneos -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -maxdepth 4 | head -n 1)
          
          if [ -d "$APP_DIR" ]; then
            cp -r "$APP_DIR" build/Payload/
            cd build && zip -r app.ipa Payload
            echo "IPA created successfully!"
          else
            echo "Error: .app file not found!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/app.ipa
