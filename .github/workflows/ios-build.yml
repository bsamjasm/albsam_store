name: Build iOS App
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Direct IPA with Fullscreen Fix
        run: |
          mkdir -p build/Payload/AlbsamApp.app

          cat << 'EOF' > main.swift
          import UIKit
          import WebKit
          import AVFoundation
          import LocalAuthentication

          // ===== إعدادات يمكن تغييرها =====
          let requireAuth = true                 // قفل Face ID / رمز الجوال عند فتح التطبيق (false لإلغائه)
          let splashSeconds: TimeInterval = 2.0  // مدة شاشة الترحيب
          let adminURL = "https://bsamjasm.github.io/albsam_store/admin.html"

          let storeGreen = UIColor(red: 0.04, green: 0.21, blue: 0.13, alpha: 1)
          let storeAmber = UIColor(red: 0.984, green: 0.749, blue: 0.141, alpha: 1)

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  // الصوت يعمل حتى لو الجوال على وضع الصامت
                  _ = try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [.mixWithOthers])
                  _ = try? AVAudioSession.sharedInstance().setActive(true)
                  // منع انطفاء الشاشة أثناء فتح اللوحة
                  application.isIdleTimerDisabled = true

                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = WebViewController()
                  window.makeKeyAndVisible()
                  self.window = window
                  return true
              }
          }

          class WebViewController: UIViewController, WKNavigationDelegate, WKUIDelegate {
              var webView: WKWebView!
              let splash = UIView()
              let splashSpinner = UIActivityIndicatorView(style: .large)
              let retryAuthButton = UIButton(type: .system)
              let errorView = UIView()
              var splashTimeUp = false
              var pageReady = false
              var authOK = false
              var splashGone = false
              var authStarted = false

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .white

                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true

                  webView = WKWebView(frame: .zero, configuration: config)
                  webView.navigationDelegate = self
                  webView.uiDelegate = self
                  webView.translatesAutoresizingMaskIntoConstraints = false
                  webView.scrollView.isScrollEnabled = true
                  webView.scrollView.bounces = true

                  let rc = UIRefreshControl()
                  rc.addTarget(self, action: #selector(reloadPage), for: .valueChanged)
                  webView.scrollView.refreshControl = rc

                  view.addSubview(webView)

                  NSLayoutConstraint.activate([
                      webView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      webView.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                      webView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      webView.trailingAnchor.constraint(equalTo: view.trailingAnchor)
                  ])

                  setupErrorView()
                  setupSplash()

                  if let url = URL(string: adminURL) {
                      webView.load(URLRequest(url: url))
                  }

                  DispatchQueue.main.asyncAfter(deadline: .now() + splashSeconds) {
                      self.splashTimeUp = true
                      self.tryHideSplash()
                  }
                  // أمان: لا تبقى شاشة الترحيب أكثر من 8 ثوانٍ بسبب بطء الشبكة
                  DispatchQueue.main.asyncAfter(deadline: .now() + 8) {
                      self.pageReady = true
                      self.tryHideSplash()
                  }
              }

              override func viewDidAppear(_ animated: Bool) {
                  super.viewDidAppear(animated)
                  if !authStarted {
                      authStarted = true
                      authenticate()
                  }
              }

              // ---------- شاشة الترحيب (نفس شاشة الموقع) ----------
              func setupSplash() {
                  splash.backgroundColor = storeGreen
                  splash.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(splash)
                  NSLayoutConstraint.activate([
                      splash.topAnchor.constraint(equalTo: view.topAnchor),
                      splash.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                      splash.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      splash.trailingAnchor.constraint(equalTo: view.trailingAnchor)
                  ])

                  let logo = UILabel()
                  logo.text = "ب"
                  logo.font = UIFont.systemFont(ofSize: 44, weight: .black)
                  logo.textColor = storeGreen
                  logo.textAlignment = .center
                  logo.backgroundColor = storeAmber
                  logo.layer.cornerRadius = 20
                  logo.layer.masksToBounds = true
                  logo.translatesAutoresizingMaskIntoConstraints = false
                  logo.widthAnchor.constraint(equalToConstant: 80).isActive = true
                  logo.heightAnchor.constraint(equalToConstant: 80).isActive = true

                  let pulse = CABasicAnimation(keyPath: "transform.scale")
                  pulse.fromValue = 1.0
                  pulse.toValue = 1.08
                  pulse.duration = 0.7
                  pulse.autoreverses = true
                  pulse.repeatCount = .infinity
                  logo.layer.add(pulse, forKey: "pulse")

                  let title = UILabel()
                  title.text = "مجمع البسام"
                  title.font = UIFont.systemFont(ofSize: 26, weight: .heavy)
                  title.textColor = .white
                  title.textAlignment = .center

                  splashSpinner.color = storeAmber
                  splashSpinner.startAnimating()

                  retryAuthButton.setTitle("فتح التطبيق", for: .normal)
                  retryAuthButton.setTitleColor(storeAmber, for: .normal)
                  retryAuthButton.titleLabel?.font = UIFont.systemFont(ofSize: 18, weight: .bold)
                  retryAuthButton.addTarget(self, action: #selector(retryAuth), for: .touchUpInside)
                  retryAuthButton.isHidden = true

                  let stack = UIStackView(arrangedSubviews: [logo, title, splashSpinner, retryAuthButton])
                  stack.axis = .vertical
                  stack.alignment = .center
                  stack.spacing = 18
                  stack.translatesAutoresizingMaskIntoConstraints = false
                  splash.addSubview(stack)
                  NSLayoutConstraint.activate([
                      stack.centerXAnchor.constraint(equalTo: splash.centerXAnchor),
                      stack.centerYAnchor.constraint(equalTo: splash.centerYAnchor)
                  ])
              }

              func tryHideSplash() {
                  guard !splashGone, splashTimeUp, pageReady, authOK else { return }
                  splashGone = true
                  UIView.animate(withDuration: 0.5, animations: {
                      self.splash.alpha = 0
                  }, completion: { _ in
                      self.splash.removeFromSuperview()
                  })
              }

              // ---------- القفل (Face ID أو رمز الجوال) ----------
              func authenticate() {
                  if !requireAuth {
                      authOK = true
                      tryHideSplash()
                      return
                  }
                  let ctx = LAContext()
                  var err: NSError?
                  if ctx.canEvaluatePolicy(.deviceOwnerAuthentication, error: &err) {
                      ctx.evaluatePolicy(.deviceOwnerAuthentication, localizedReason: "افتح لوحة إدارة مجمع البسام") { ok, _ in
                          DispatchQueue.main.async {
                              if ok {
                                  self.authOK = true
                                  self.retryAuthButton.isHidden = true
                                  self.splashSpinner.startAnimating()
                                  self.tryHideSplash()
                              } else {
                                  self.splashSpinner.stopAnimating()
                                  self.retryAuthButton.isHidden = false
                              }
                          }
                      }
                  } else {
                      // لا يوجد قفل على الجوال: يُفتح التطبيق مباشرة
                      authOK = true
                      tryHideSplash()
                  }
              }

              @objc func retryAuth() {
                  retryAuthButton.isHidden = true
                  splashSpinner.startAnimating()
                  authenticate()
              }

              // ---------- شاشة انقطاع الإنترنت ----------
              func setupErrorView() {
                  errorView.backgroundColor = .white
                  errorView.isHidden = true
                  errorView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(errorView)
                  NSLayoutConstraint.activate([
                      errorView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      errorView.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                      errorView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      errorView.trailingAnchor.constraint(equalTo: view.trailingAnchor)
                  ])

                  let label = UILabel()
                  label.text = "لا يوجد اتصال بالإنترنت\nتأكد من الشبكة ثم أعد المحاولة"
                  label.numberOfLines = 0
                  label.textAlignment = .center
                  label.font = UIFont.systemFont(ofSize: 17, weight: .semibold)
                  label.textColor = storeGreen

                  let button = UIButton(type: .system)
                  button.setTitle("إعادة المحاولة", for: .normal)
                  button.setTitleColor(.white, for: .normal)
                  button.backgroundColor = storeGreen
                  button.titleLabel?.font = UIFont.systemFont(ofSize: 17, weight: .bold)
                  button.layer.cornerRadius = 12
                  button.translatesAutoresizingMaskIntoConstraints = false
                  button.widthAnchor.constraint(equalToConstant: 180).isActive = true
                  button.heightAnchor.constraint(equalToConstant: 46).isActive = true
                  button.addTarget(self, action: #selector(reloadPage), for: .touchUpInside)

                  let stack = UIStackView(arrangedSubviews: [label, button])
                  stack.axis = .vertical
                  stack.alignment = .center
                  stack.spacing = 20
                  stack.translatesAutoresizingMaskIntoConstraints = false
                  errorView.addSubview(stack)
                  NSLayoutConstraint.activate([
                      stack.centerXAnchor.constraint(equalTo: errorView.centerXAnchor),
                      stack.centerYAnchor.constraint(equalTo: errorView.centerYAnchor),
                      stack.leadingAnchor.constraint(greaterThanOrEqualTo: errorView.leadingAnchor, constant: 24),
                      stack.trailingAnchor.constraint(lessThanOrEqualTo: errorView.trailingAnchor, constant: -24)
                  ])
              }

              @objc func reloadPage() {
                  errorView.isHidden = true
                  if webView.url == nil {
                      if let url = URL(string: adminURL) { webView.load(URLRequest(url: url)) }
                  } else {
                      webView.reload()
                  }
              }

              func handleLoadError(_ error: Error) {
                  webView.scrollView.refreshControl?.endRefreshing()
                  if (error as NSError).code == NSURLErrorCancelled { return }
                  errorView.isHidden = false
                  pageReady = true
                  tryHideSplash()
              }

              func webView(_ webView: WKWebView, didFail navigation: WKNavigation!, withError error: Error) {
                  handleLoadError(error)
              }

              func webView(_ webView: WKWebView, didFailProvisionalNavigation navigation: WKNavigation!, withError error: Error) {
                  handleLoadError(error)
              }

              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  errorView.isHidden = true
                  webView.scrollView.refreshControl?.endRefreshing()
                  pageReady = true
                  tryHideSplash()

                  let script = """
                  var meta = document.querySelector('meta[name=viewport]');
                  if (!meta) {
                      meta = document.createElement('meta');
                      meta.name = 'viewport';
                      document.getElementsByTagName('head')[0].appendChild(meta);
                  }
                  meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';

                  var style = document.createElement('style');
                  style.innerHTML = 'header { position: relative !important; top: 0 !important; width: 100% !important; } body { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }';
                  document.head.appendChild(style);
                  """
                  webView.evaluateJavaScript(script, completionHandler: nil)
              }

              // فتح روابط الاتصال والواتساب في التطبيقات الخارجية
              func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                  if let url = navigationAction.request.url {
                      let scheme = url.scheme?.lowercased() ?? ""
                      let host = url.host?.lowercased() ?? ""
                      if ["tel", "mailto", "whatsapp", "sms"].contains(scheme) || host == "wa.me" || host == "api.whatsapp.com" {
                          UIApplication.shared.open(url)
                          decisionHandler(.cancel)
                          return
                      }
                  }
                  decisionHandler(.allow)
              }

              // الروابط التي تُفتح في نافذة جديدة (target=_blank) تُفتح خارج التطبيق
              func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration, for navigationAction: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                  if let url = navigationAction.request.url {
                      UIApplication.shared.open(url)
                  }
                  return nil
              }

              func webView(_ webView: WKWebView, runJavaScriptAlertPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping () -> Void) {
                  let alert = UIAlertController(title: nil, message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "حسناً", style: .default) { _ in completionHandler() })
                  present(alert, animated: true)
              }

              func webView(_ webView: WKWebView, runJavaScriptConfirmPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (Bool) -> Void) {
                  let alert = UIAlertController(title: nil, message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "نعم", style: .default) { _ in completionHandler(true) })
                  alert.addAction(UIAlertAction(title: "إلغاء", style: .cancel) { _ in completionHandler(false) })
                  present(alert, animated: true)
              }
          }

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EOF

          cat << 'EOF' > LaunchScreen.storyboard
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21507" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="375" height="667"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <color key="backgroundColor" red="0.04" green="0.21" blue="0.13" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                  </scene>
              </scenes>
          </document>
          EOF

          xcrun ibtool --compile build/Payload/AlbsamApp.app/LaunchScreen.storyboardc LaunchScreen.storyboard --target-device iphone --target-device ipad --minimum-deployment-target 15.0 --errors --warnings

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc main.swift \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -framework UIKit \
            -framework WebKit \
            -framework Foundation \
            -framework AVFoundation \
            -framework LocalAuthentication \
            -o build/Payload/AlbsamApp.app/AlbsamApp

          chmod +x build/Payload/AlbsamApp.app/AlbsamApp

          if [ -f "لوكو.png" ]; then
            sips -s format png -z 120 120 "لوكو.png" --out build/Payload/AlbsamApp.app/AppIcon60x60@2x.png || true
            sips -s format png -z 180 180 "لوكو.png" --out build/Payload/AlbsamApp.app/AppIcon60x60@3x.png || true
          fi

          cat << 'EOF' > build/Payload/AlbsamApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>AlbsamApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.bsamjasm.albsamstore</string>
              <key>CFBundleName</key>
              <string>AlbsamStore</string>
              <key>CFBundleDisplayName</key>
              <string>AlbsamStore</string>
              <key>CFBundleVersion</key>
              <string>1.3</string>
              <key>CFBundleShortVersionString</key>
              <string>1.3</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60</string>
                      </array>
                  </dict>
              </dict>
              <key>NSCameraUsageDescription</key>
              <string>لالتقاط صور المنتجات وإضافتها إلى المتجر</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>لاختيار صور المنتجات من الاستوديو</string>
              <key>NSFaceIDUsageDescription</key>
              <string>لحماية لوحة الإدارة بقفل الجوال</string>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - build/Payload/AlbsamApp.app
          cd build && zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/app.ipa
