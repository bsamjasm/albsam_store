name: Build iOS App
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pods
        run: |
          cd src
          pod install || true
          cd ..

      - name: Build Xcode Project
        run: |
          PROJ_PATH=$(find . -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
            PROJ_NAME=$(basename "$PROJ_PATH" .xcodeproj)
            xcodebuild -project "$PROJ_PATH" -scheme "$PROJ_NAME" -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            PROJ_NAME=$(basename "$PROJ_PATH" .xcworkspace)
            xcodebuild -workspace "$PROJ_PATH" -scheme "$PROJ_NAME" -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          fi
          mkdir -p build/Payload
          mv build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/app.ipa
