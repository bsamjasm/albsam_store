name: Build iOS App
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pods
        run: |
          cd src
          pod install --repo-update || true
          cd ..

      - name: Build Xcode Project
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          WORKSPACE_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          
          xcodebuild -workspace "$WORKSPACE_PATH" -scheme "$WORKSPACE_NAME" -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES
          
          mkdir -p build/Payload
          mv build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/app.ipa
