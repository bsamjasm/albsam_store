name: Build iOS App
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Clean Xcode Project
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          PROJ_NAME=$(basename "$PROJ_PATH" .xcodeproj)

          echo "Building project safely: $PROJ_PATH"
          xcodebuild -project "$PROJ_PATH" -scheme "$PROJ_NAME" -sdk iphoneos -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true
          
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            mkdir -p build/Payload
            cp -r "$APP_PATH" build/Payload/
            cd build && zip -r app.ipa Payload
          else
            echo "App build output not found, searching alternative path..."
            find . -name "*.app"
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/app.ipa
