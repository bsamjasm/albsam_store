name: Build iOS App
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Pods References and Build
        run: |
          cd src
          # حذف أي ملفات بودز قديمة لو وجدت
          rm -rf Pods Podfile Podfile.lock *.xcworkspace
          
          # إزالة إعدادات الـ Pods الإجبارية من ملف الإكسكود لكي لا يتوقف البناء عليها
          find . -name "project.pbxproj" -type f -exec sed -i '' '/Pods/d' {} +
          cd ..

          PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          PROJ_NAME=$(basename "$PROJ_PATH" .xcodeproj)

          echo "Building clean project: $PROJ_PATH"
          xcodebuild -project "$PROJ_PATH" -scheme "$PROJ_NAME" -sdk iphoneos -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true

          # التقاط ملف التطبيق الناتج ووضعه في حزمة الـ IPA
          mkdir -p build/Payload
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -maxdepth 4 | head -n 1)
          
          if [ -d "$APP_DIR" ]; then
            cp -r "$APP_DIR" build/Payload/
            cd build && zip -r app.ipa Payload
            echo "IPA created successfully!"
          else
            echo "Error: .app file not found!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/app.ipa
