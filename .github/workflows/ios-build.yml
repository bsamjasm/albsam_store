name: Build iOS App
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Pods Phases and Build
        run: |
          cd src
          # إزالة ملفات ومجلدات الـ Pods القديمة
          rm -rf Pods Podfile Podfile.lock *.xcworkspace
          
          # استخدام بايثون لإزالة مراحل بناء الـ Pods الإجبارية من ملف المشروع بأمان تام
          python3 - << 'EOF'
          import glob
          import os

          for pbxproj in glob.glob("**/project.pbxproj", recursive=True):
              print(f"Cleaning build phases in {pbxproj}...")
              with open(pbxproj, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              new_lines = []
              for line in lines:
                  # استبعاد أي سطر يتعلق بملفات أو مراحل البودز المعطلة
                  if "Pods-" in line or "[CP] Embed Pods" in line or "[CP] Copy Pods" in line or "xcfilelist" in line:
                      continue
                  new_lines.append(line)
                  
              with open(pbxproj, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)
          EOF
          cd ..

          PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          PROJ_NAME=$(basename "$PROJ_PATH" .xcodeproj)

          echo "Building clean project: $PROJ_PATH"
          xcodebuild -project "$PROJ_PATH" -scheme "$PROJ_NAME" -sdk iphoneos -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true

          mkdir -p build/Payload
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -maxdepth 4 | head -n 1)
          
          if [ -d "$APP_DIR" ]; then
            cp -r "$APP_DIR" build/Payload/
            cd build && zip -r app.ipa Payload
            echo "IPA created successfully!"
          else
            echo "Error: .app file not found!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/app.ipa
