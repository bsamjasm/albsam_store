name: cancel-stuck-pages
on: workflow_dispatch
permissions:
  pages: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X POST repos/${{ github.repository }}/pages/deployments/1220932e1b7a4b74d3fce1efa7a724c9072c94a8/cancel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
