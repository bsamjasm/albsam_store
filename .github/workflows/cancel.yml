name: cancel-stuck-pages
on: workflow_dispatch
permissions:
  pages: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X POST repos/${{ github.repository }}/pages/deployments/e5c93aaaaa3900083d5b8b443bba96183167a7a5/cancel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
