<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة تحكم مجمع البسام</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef6ff',
                            100: '#d9eaff',
                            500: '#0284c7',
                            600: '#0369a1',
                            750: '#0f172a',
                            800: '#0b1329',
                            900: '#060a17',
                        },
                        gold: {
                            400: '#facc15',
                            500: '#eab308',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24 selection:bg-brand-500 selection:text-white">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 -translate-y-32 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-2.5 rounded-2xl shadow-xl flex items-center gap-3 border border-slate-700 text-sm">
        <i id="toast-icon" class="text-emerald-400 text-base"></i>
        <span id="toast-message" class="font-semibold"></span>
    </div>

    <!-- iPhone Header -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-sm border-b border-slate-200">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 bg-brand-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-sliders text-sm text-gold-400"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-sm">إدارة مجمع البسام</h1>
                    <p class="text-[10px] text-slate-500 font-medium">لوحة تحكم الهاتف (آيفون)</p>
                </div>
            </div>
            <button onclick="openAddModal()" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-md transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i>
                <span>منتج جديد</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 pt-6 space-y-4">
        
        <!-- Stats Overview -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl border border-slate-200/85 shadow-sm flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-medium">إجمالي المنتجات</span>
                    <span id="total-count" class="text-lg font-black text-slate-900">0</span>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200/85 shadow-sm flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-medium">المنتجات المتوفرة</span>
                    <span id="available-count" class="text-lg font-black text-slate-900">0</span>
                </div>
            </div>
        </div>

        <!-- Section Title & Category Filter Tabs -->
        <div class="flex flex-col gap-2.5 pt-2">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-800 text-sm">قائمة المنتجات الحالية</h3>
                <span class="text-[10px] text-slate-400">انقر للفلترة الفورية</span>
            </div>
            
            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                <button onclick="filterCategory('الكل')" id="cat-btn-الكل" class="category-btn px-3 py-1.5 rounded-xl text-xs font-bold transition-all bg-brand-600 text-white shadow-sm flex-shrink-0">
                    الكل
                </button>
                <button onclick="filterCategory('إلكترونيات')" id="cat-btn-إلكترونيات" class="category-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 flex-shrink-0">
                    إلكترونيات
                </button>
                <button onclick="filterCategory('منزلية')" id="cat-btn-منزلية" class="category-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 flex-shrink-0">
                    منزلية
                </button>
                <button onclick="filterCategory('اكسسوارات')" id="cat-btn-اكسسوارات" class="category-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 flex-shrink-0">
                    إكسسوارات
                </button>
            </div>
        </div>

        <!-- Products List -->
        <div id="admin-products-list" class="space-y-3"></div>

    </main>

    <!-- Bottom Actions Bar -->
    <div class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-slate-200 p-4 z-30">
        <div class="max-w-md mx-auto flex gap-3">
            <button onclick="exportData()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-xs shadow-md transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-download"></i>
                <span>تصدير كود المنتجات للمتجر</span>
            </button>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-100">
                <h3 id="modal-title" class="font-bold text-slate-900 text-base">إضافة منتج جديد</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="product-form" onsubmit="saveProduct(event)" class="space-y-4">
                <input type="hidden" id="product-id">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">اسم المنتج</label>
                    <input type="text" id="p-name" required placeholder="مثال: شاشة ذكية 55 بوصة" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">السعر (د.ع)</label>
                        <input type="number" id="p-price" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">القسم</label>
                        <select id="p-category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                            <option value="إلكترونيات">إلكترونيات</option>
                            <option value="منزلية">منزلية</option>
                            <option value="اكسسوارات">اكسسوارات</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">رابط الصورة أو رفع من الآيفون</label>
                    <div class="flex gap-2">
                        <input type="url" id="p-image" required placeholder="https://..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <label class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold cursor-pointer flex items-center gap-1 transition-all flex-shrink-0">
                            <i class="fa-solid fa-camera"></i>
                            <span>استوديو</span>
                            <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">حالة التوفر</label>
                    <select id="p-status" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="متوفر">متوفر في المخزون</option>
                        <option value="غير متوفر">نفذت الكمية (غير متوفر)</option>
                    </select>
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-brand-500/20 text-sm transition-all">
                        حفظ المنتج
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Export Result Modal -->
    <div id="export-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl">
            <h3 class="font-bold text-slate-900 text-base mb-2">تصدير المنتجات لمتجرك</h3>
            <p class="text-xs text-slate-500 mb-4">انسخ الكود أدناه واستبدله بدقّة داخل مصفوفة الـ `products` في ملف المتجر الأساسي `index.html`:</p>
            <textarea id="export-code-area" readonly class="w-full h-40 bg-slate-100 border border-slate-200 rounded-xl p-3 text-xs font-mono focus:outline-none resize-none mb-4"></textarea>
            <div class="flex gap-2">
                <button onclick="copyExportCode()" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 rounded-xl text-xs transition-all">
                    نسخ الكود
                </button>
                <button onclick="closeExportModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-2.5 rounded-xl text-xs transition-all">
                    إغلاق
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const defaultProducts = [
            {
                id: 1,
                name: "شاشة ذكية 55 بوصة 4K UHD",
                category: "إلكترونيات",
                price: 450000,
                image: "https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=600&q=80",
                status: "متوفر"
            },
            {
                id: 2,
                name: "قلاية هوائية ذكية بدون زيت 6 لتر",
                category: "منزلية",
                price: 120000,
                image: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=600&q=80",
                status: "متوفر"
            },
            {
                id: 3,
                name: "سماعات رأس لاسلكية مانعة للضوضاء",
                category: "اكسسوارات",
                price: 95000,
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80",
                status: "متوفر"
            }
        ];

        let products = JSON.parse(localStorage.getItem('al_bassam_admin_products')) || defaultProducts;
        let currentFilter = 'الكل';

        document.addEventListener('DOMContentLoaded', () => {
            renderAdminProducts();
        });

        function formatPrice(price) {
            return Number(price).toLocaleString('en-US') + ' د.ع';
        }

        function filterCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition-all bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 flex-shrink-0";
            });
            const activeBtn = document.getElementById(`cat-btn-${category}`);
            if (activeBtn) {
                activeBtn.className = "category-btn px-3 py-1.5 rounded-xl text-xs font-bold transition-all bg-brand-600 text-white shadow-sm flex-shrink-0";
            }
            renderAdminProducts();
        }

        function renderAdminProducts() {
            const listContainer = document.getElementById('admin-products-list');
            document.getElementById('total-count').textContent = products.length;
            document.getElementById('available-count').textContent = products.filter(p => p.status === 'متوفر').length;

            let filteredProducts = products;
            if (currentFilter !== 'الكل') {
                filteredProducts = products.filter(p => p.category === currentFilter);
            }

            if (filteredProducts.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-slate-200">
                        <p class="text-slate-400 text-sm">لا توجد منتجات في هذا القسم حالياً.</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filteredProducts.map(product => `
                <div class="bg-white rounded-2xl border border-slate-200/80 p-3.5 shadow-sm flex items-center gap-3">
                    <img src="${product.image}" alt="${product.name}" class="w-16 h-16 rounded-xl object-cover bg-slate-100 flex-shrink-0" onerror="this.src='https://placehold.co/200x200/f1f5f9/64748b?text=صورة'">
                    <div class="flex-1 min-w-0">
                        <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-semibold">${product.category}</span>
                        <h4 class="font-bold text-slate-900 text-xs truncate mt-1">${product.name}</h4>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-brand-600 font-extrabold text-xs">${formatPrice(product.price)}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${product.status === 'متوفر' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">${product.status}</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <div class="flex gap-1">
                            <button onclick="editProduct(${product.id})" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-brand-50 hover:text-brand-600 text-slate-600 flex items-center justify-center text-xs transition-colors" title="تعديل">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteProduct(${product.id})" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 flex items-center justify-center text-xs transition-colors" title="حذف">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                        <button onclick="toggleStatus(${product.id})" class="w-full h-7 rounded-lg text-[10px] font-bold transition-all flex items-center justify-center gap-1 ${product.status === 'متوفر' ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-rose-100 text-rose-700 hover:bg-rose-200'}">
                            <i class="fa-solid ${product.status === 'متوفر' ? 'fa-check' : 'fa-xmark'}"></i>
                            <span>${product.status === 'متوفر' ? 'متوفر' : 'غير متوفر'}</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleStatus(id) {
            const product = products.find(p => p.id === id);
            if (product) {
                product.status = product.status === 'متوفر' ? 'غير متوفر' : 'متوفر';
                saveToLocalStorage();
                showToast(`تم تغيير حالة "${product.name}" إلى ${product.status}`);
            }
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('p-image').value = event.target.result;
                    showToast("تم تحميل الصورة من الهاتف بنجاح!");
                };
                reader.readAsDataURL(file);
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('al_bassam_admin_products', JSON.stringify(products));
            renderAdminProducts();
        }

        function openAddModal() {
            document.getElementById('modal-title').textContent = 'إضافة منتج جديد';
            document.getElementById('product-id').value = '';
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-category').value = 'إلكترونيات';
            document.getElementById('p-image').value = '';
            document.getElementById('p-status').value = 'متوفر';
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('modal-title').textContent = 'تعديل المنتج';
            document.getElementById('product-id').value = product.id;
            document.getElementById('p-name').value = product.name;
            document.getElementById('p-price').value = product.price;
            document.getElementById('p-category').value = product.category;
            document.getElementById('p-image').value = product.image;
            document.getElementById('p-status').value = product.status;
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const name = document.getElementById('p-name').value.trim();
            const price = Number(document.getElementById('p-price').value);
            const category = document.getElementById('p-category').value;
            const image = document.getElementById('p-image').value.trim();
            const status = document.getElementById('p-status').value;

            if (id) {
                const product = products.find(p => p.id == id);
                if (product) {
                    product.name = name;
                    product.price = price;
                    product.category = category;
                    product.image = image;
                    product.status = status;
                }
                showToast("تم تحديث المنتج بنجاح!");
            } else {
                const newProduct = {
                    id: Date.now(),
                    name,
                    price,
                    category,
                    image,
                    status
                };
                products.push(newProduct);
                showToast("تم إضافة المنتج الجديد بنجاح!");
            }

            saveToLocalStorage();
            closeModal();
        }

        function deleteProduct(id) {
            if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                products = products.filter(p => p.id !== id);
                saveToLocalStorage();
                showToast("تم حذف المنتج بنجاح");
            }
        }

        function exportData() {
            const codeString = JSON.stringify(products, null, 4);
            document.getElementById('export-code-area').value = codeString;
            document.getElementById('export-modal').classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('export-modal').classList.add('hidden');
        }

        function copyExportCode() {
            const textarea = document.getElementById('export-code-area');
            textarea.select();
            document.execCommand('copy');
            showToast("تم نسخ الكود بنجاح!");
            closeExportModal();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toastMessage.textContent = message;
            toast.classList.remove('-translate-y-32', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-32', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
