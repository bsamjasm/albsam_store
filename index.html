<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجمع البسام — كل ما تحتاجه في مكان واحد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Readex+Pro:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        display: ['Readex Pro', 'Cairo', 'sans-serif']
                    },
                    colors: {
                        surface: '#F8F7F4',
                        ink: '#12161F',
                        gold: {
                            400: '#FBBF24',
                            500: '#D97706',
                            600: '#B45309'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #F8F7F4;
            color: #12161F;
        }
        h1, h2, h3, .font-display {
            font-family: 'Readex Pro', 'Cairo', sans-serif;
        }
        /* ملمس يدوي خفيف لكسر جمود القوالب الجاهزة (Human-Like Design) */
        .organic-hero {
            background-color: #12161F;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(217, 119, 6, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(251, 191, 36, 0.1) 0%, transparent 45%);
        }
        /* ظلال ملموسة مخصصة (Tactile Shadows) */
        .tactile-card {
            box-shadow: 0 4px 20px -2px rgba(18, 22, 31, 0.05), 0 2px 6px -1px rgba(18, 22, 31, 0.03);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .tactile-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 32px -4px rgba(18, 22, 31, 0.1), 0 4px 12px -2px rgba(18, 22, 31, 0.05);
        }
        .tactile-btn {
            box-shadow: 0 3px 0 #92400e;
            transition: all 0.15s ease;
        }
        .tactile-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #92400e;
        }
        /* إخفاء شريط التمرير للأقسام في الموبايل */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-white">

    <!-- إشعار منبثق (Toast) بتصميم أنيق -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-32 opacity-0 transition-all duration-300 bg-ink text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-700/80">
        <span class="w-7 h-7 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center">
            <i class="fa-solid fa-check text-sm"></i>
        </span>
        <span id="toast-message" class="font-bold text-sm"></span>
    </div>

    <!-- الهيدر المطابق لثيم bsam.lovable.app مع لمسة فخامة -->
    <header class="sticky top-0 z-40 bg-[#F8F7F4]/90 backdrop-blur-md border-b border-stone-200/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20 gap-4">
                <!-- الشعار: حرف "ب" + مجمع البسام -->
                <a href="#" class="flex items-center gap-3 group shrink-0">
                    <span class="w-11 h-11 rounded-2xl bg-ink text-amber-400 font-display font-extrabold text-2xl flex items-center justify-center shadow-md border border-stone-700 group-hover:rotate-[-4deg] transition-transform">ب</span>
                    <span class="text-xl sm:text-2xl font-display font-extrabold text-ink tracking-tight">مجمع البسام</span>
                </a>

                <!-- شريط البحث المتقدم -->
                <div class="hidden md:flex flex-1 max-w-md mx-6">
                    <div class="relative w-full">
                        <input type="text" id="desktop-search" oninput="handleSearch(this.value)" placeholder="ابحث عن منتج، جهاز، أو اكسسوار..." class="w-full bg-white border border-stone-200/90 rounded-2xl py-2.5 pr-11 pl-4 text-sm font-medium focus:outline-none focus:border-amber-500 focus:ring-4 focus:ring-amber-500/10 transition-all shadow-sm">
                        <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-stone-400 text-sm"></i>
                    </div>
                </div>

                <!-- زر السلة التفاعلي -->
                <button onclick="toggleCart()" class="relative bg-ink hover:bg-slate-800 text-white px-4 py-2.5 rounded-2xl transition-all flex items-center gap-2.5 shadow-sm cursor-pointer active:scale-95">
                    <i class="fa-solid fa-bag-shopping text-amber-400 text-base"></i>
                    <span class="font-bold text-sm">السلة</span>
                    <span id="cart-counter" class="bg-amber-500 text-ink text-xs font-extrabold px-2 py-0.5 rounded-full min-w-[24px] text-center">0</span>
                </button>
            </div>

            <!-- بحث الموبايل -->
            <div class="md:hidden pb-3">
                <div class="relative w-full">
                    <input type="text" oninput="handleSearch(this.value)" placeholder="ابحث عن منتج، جهاز، أو اكسسوار..." class="w-full bg-white border border-stone-200 rounded-xl py-2.5 pr-10 pl-4 text-sm focus:outline-none focus:border-amber-500 shadow-sm">
                    <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3 text-stone-400 text-sm"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1">
        <!-- قسم الترحيب (Hero Section) المطابق لـ bsam.lovable.app -->
        <section class="organic-hero text-white py-20 sm:py-28 px-4 relative overflow-hidden border-b border-stone-800">
            <div class="max-w-4xl mx-auto text-center relative z-10 space-y-6">
                <div class="inline-flex items-center gap-2 bg-amber-500/10 text-amber-400 border border-amber-500/25 font-bold text-xs sm:text-sm px-4 py-1.5 rounded-full">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span>أهلاً بكم</span>
                </div>
                <h1 class="text-4xl sm:text-6xl font-display font-extrabold tracking-tight text-white leading-tight">
                    مجمع البسام
                </h1>
                <p class="text-stone-300 text-base sm:text-xl max-w-2xl mx-auto font-normal leading-relaxed">
                    كل ما تحتاجه في مكان واحد — اختر منتجاتك، وأرسل طلبك بضغطة زر.
                </p>
                <div class="pt-3">
                    <a href="#products" class="tactile-btn inline-flex items-center gap-2.5 bg-amber-500 hover:bg-amber-400 text-ink font-extrabold px-8 py-4 rounded-2xl text-base">
                        <span>تسوّق الآن</span>
                        <i class="fa-solid fa-arrow-down text-sm"></i>
                    </a>
                </div>
            </div>
        </section>

        <!-- قسم المنتجات (#products) -->
        <section id="products" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
            <div class="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-6">
                <div>
                    <h2 class="text-2xl sm:text-3xl font-display font-extrabold text-ink">منتجاتنا</h2>
                    <div class="w-14 h-1.5 bg-amber-500 rounded-full mt-2"></div>
                </div>

                <!-- فلاتر الأقسام -->
                <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                    <button onclick="filterCategory('الكل')" id="tab-الكل" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-ink text-white shadow-sm whitespace-nowrap cursor-pointer">الكل</button>
                    <button onclick="filterCategory('إلكترونيات')" id="tab-إلكترونيات" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-white text-stone-600 hover:bg-stone-100 border border-stone-200/90 whitespace-nowrap cursor-pointer">الإلكترونيات</button>
                    <button onclick="filterCategory('منزلية')" id="tab-منزلية" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-white text-stone-600 hover:bg-stone-100 border border-stone-200/90 whitespace-nowrap cursor-pointer">المنزلية</button>
                    <button onclick="filterCategory('اكسسوارات')" id="tab-اكسسوارات" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-white text-stone-600 hover:bg-stone-100 border border-stone-200/90 whitespace-nowrap cursor-pointer">الاكسسوارات</button>
                </div>
            </div>

            <!-- شبكة المنتجات -->
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

            <!-- حالة عدم وجود نتائج -->
            <div id="no-results" class="hidden text-center py-16 bg-white rounded-3xl border border-stone-200/60 my-4">
                <div class="w-16 h-16 bg-stone-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-stone-400 text-2xl">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h4 class="text-base font-bold text-stone-700">لم نعثر على منتج يطابق بحثك</h4>
            </div>
        </section>
    </main>

    <!-- سلة المشتريات الجانبية (UI/UX Pro Max) -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div onclick="toggleCart()" class="absolute inset-0 bg-ink/60 backdrop-blur-sm transition-opacity"></div>
        <div class="absolute inset-y-0 left-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                <!-- رأس السلة -->
                <div class="p-6 border-b border-stone-100 flex items-center justify-between bg-ink text-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-amber-500 text-ink rounded-xl flex items-center justify-center font-black">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </div>
                        <div>
                            <h3 class="text-base font-display font-bold">سلة المشتريات</h3>
                            <p class="text-xs text-stone-400" id="cart-items-count-text">0 منتجات</p>
                        </div>
                    </div>
                    <button onclick="toggleCart()" class="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center cursor-pointer transition-colors">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <!-- قائمة العناصر -->
                <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4 divide-y divide-stone-100"></div>

                <!-- بيانات التوصيل -->
                <div class="px-6 py-4 bg-[#F8F7F4] border-t border-stone-200/80 space-y-3">
                    <h4 class="text-xs font-extrabold text-ink uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-location-dot text-amber-600"></i>
                        <span>بيانات التوصيل السريع</span>
                    </h4>
                    <div>
                        <label class="block text-xs font-bold text-stone-600 mb-1">رقم الهاتف</label>
                        <input type="tel" id="customer-phone" placeholder="0770xxxxxxx" class="w-full bg-white border border-stone-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-stone-600 mb-1">العنوان (المحافظة والمنطقة)</label>
                        <input type="text" id="customer-address" placeholder="مثال: بغداد - الكرادة" class="w-full bg-white border border-stone-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <!-- الإجمالي وزر الإرسال -->
                <div class="p-6 border-t border-stone-200 bg-white space-y-4">
                    <div class="space-y-1.5">
                        <div class="flex justify-between text-xs text-stone-500">
                            <span>المجموع الفرعي:</span>
                            <span id="cart-subtotal" class="font-bold text-ink">0 د.ع</span>
                        </div>
                        <div class="flex justify-between text-xs text-stone-500">
                            <span>التوصيل:</span>
                            <span class="text-emerald-600 font-bold">مجاني</span>
                        </div>
                        <div class="pt-2 border-t border-stone-100 flex justify-between text-base font-extrabold text-ink">
                            <span>المجموع الكلي:</span>
                            <span id="cart-total" class="text-amber-600 text-lg">0 د.ع</span>
                        </div>
                    </div>

                    <button id="submit-order-btn" onclick="submitOrderTelegram()" class="tactile-btn w-full bg-amber-500 hover:bg-amber-400 text-ink font-extrabold py-3.5 rounded-2xl flex items-center justify-center gap-2 cursor-pointer text-sm">
                        <i class="fa-brands fa-telegram text-lg"></i>
                        <span>إرسال الطلب الآن بضغطة زر</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- الفوتر المطابق -->
    <footer class="bg-ink text-stone-400 py-8 border-t border-stone-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm font-medium">
            © مجمع البسام
        </div>
    </footer>

    <script>
        // 1. إعدادات السحابة (Firebase Realtime Database)
        const firebaseConfig = {
            databaseURL: "https://albsam-store-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. المنتجات الافتراضية الأساسية (تمنع ظهور الصفحة فارغة نهائياً)
        const defaultProducts = [
            { id: 101, name: "جهاز استريو منزلي متطور مع مكبرات صوت", category: "إلكترونيات", price: 175000, image: "https://images.unsplash.com/photo-1545454675-3531b543be5d?auto=format&fit=crop&w=600&q=80", status: "متوفر" },
            { id: 102, name: "ماكينة قهوة إسبريسو احترافية", category: "منزلية", price: 210000, image: "https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?auto=format&fit=crop&w=600&q=80", status: "متوفر" },
            { id: 103, name: "ساعة ذكية رياضية متطورة مقاومة للماء", category: "اكسسوارات", price: 65000, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80", status: "متوفر" },
            { id: 104, name: "مصباح إضاءة ليد ذكي ديكوري للمنزل", category: "منزلية", price: 35000, image: "https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?auto=format&fit=crop&w=600&q=80", status: "متوفر" },
            { id: 105, name: "مفرغة هواء وممسحة ذكية متعددة الاستخدام", category: "منزلية", price: 140000, image: "https://images.unsplash.com/photo-1558317374-067fb5f30001?auto=format&fit=crop&w=600&q=80", status: "متوفر" }
        ];

        let products = JSON.parse(localStorage.getItem('al_bassam_cache_products')) || defaultProducts;
        let currentCategory = 'الكل';
        let searchQuery = '';
        let cart = [];

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();

            db.ref('products').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && Object.keys(data).length > 0) {
                    products = Object.values(data);
                } else {
                    products = defaultProducts;
                }
                localStorage.setItem('al_bassam_cache_products', JSON.stringify(products));
                renderProducts();
            });
            updateCartUI();
        });

        function formatPrice(price) {
            return Number(price).toLocaleString('en-US') + ' د.ع';
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = (btn.id === `tab-${category}`)
                    ? "tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-ink text-white shadow-sm whitespace-nowrap cursor-pointer"
                    : "tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-white text-stone-600 hover:bg-stone-100 border border-stone-200/90 whitespace-nowrap cursor-pointer";
            });
            renderProducts();
        }

        function handleSearch(query) {
            searchQuery = query.trim().toLowerCase();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const noResults = document.getElementById('no-results');

            const filtered = products.filter(p => {
                const matchesCategory = (currentCategory === 'الكل' || p.category === currentCategory);
                const matchesSearch = p.name.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = filtered.map(product => {
                const isAvailable = product.status === 'متوفر' || !product.status;
                return `
                <div class="tactile-card bg-white rounded-2xl border border-stone-200/80 flex flex-col overflow-hidden group">
                    <div class="relative bg-stone-100 h-56 overflow-hidden">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/600x400/f1f5f9/64748b?text=مجمع+البسام'">
                        <span class="absolute bottom-3 right-3 bg-ink/85 backdrop-blur-sm text-white text-[11px] font-bold px-2.5 py-1 rounded-lg">${product.category}</span>
                        <span class="absolute top-3 left-3 text-[11px] font-extrabold px-2.5 py-1 rounded-full ${isAvailable ? 'bg-emerald-500/95 text-white' : 'bg-rose-500/95 text-white'}">
                            ${isAvailable ? 'متوفر' : 'غير متوفر'}
                        </span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <h3 class="font-bold text-ink text-base mb-3 line-clamp-2 leading-snug">${product.name}</h3>
                        <div class="pt-3.5 border-t border-stone-100 flex items-center justify-between mt-auto">
                            <span class="text-lg font-extrabold text-ink">${formatPrice(product.price)}</span>
                            <button onclick="addToCart(${product.id})" ${!isAvailable ? 'disabled' : ''} class="${isAvailable ? 'bg-ink hover:bg-amber-500 hover:text-ink text-white cursor-pointer active:scale-95' : 'bg-stone-200 text-stone-400 cursor-not-allowed'} px-4 py-2.5 rounded-xl font-bold text-xs flex items-center gap-1.5 transition-all">
                                <i class="fa-solid fa-cart-plus"></i>
                                <span>أضف للسلة</span>
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product || product.status === 'غير متوفر') return;
            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) existingItem.quantity += 1;
            else cart.push({ ...product, quantity: 1 });
            updateCartUI();
            showToast("تمت الإضافة إلى سلة المشتريات");
        }

        function updateQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity <= 0) cart = cart.filter(i => i.id !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            const counter = document.getElementById('cart-counter');
            const countText = document.getElementById('cart-items-count-text');
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('cart-subtotal');
            const totalEl = document.getElementById('cart-total');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            counter.textContent = totalCount;
            if (countText) countText.textContent = `${totalCount} منتجات`;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-14 text-stone-400">
                        <i class="fa-solid fa-bag-shopping text-4xl mb-3 opacity-30"></i>
                        <p class="font-bold text-sm">السلة فارغة حالياً</p>
                    </div>`;
                subtotalEl.textContent = formatPrice(0);
                totalEl.textContent = formatPrice(0);
                return;
            }

            let subtotal = 0;
            container.innerHTML = cart.map(item => {
                subtotal += item.price * item.quantity;
                return `
                    <div class="py-4 flex items-center gap-3.5">
                        <img src="${item.image}" class="w-16 h-16 object-cover rounded-xl bg-stone-100 border border-stone-200 shrink-0">
                        <div class="flex-1 min-w-0">
                            <h5 class="font-bold text-ink text-sm truncate">${item.name}</h5>
                            <p class="text-amber-600 font-extrabold text-sm mt-0.5">${formatPrice(item.price)}</p>
                            <div class="flex items-center gap-3 mt-2">
                                <div class="flex items-center border border-stone-200 rounded-lg bg-[#F8F7F4]">
                                    <button onclick="updateQuantity(${item.id}, -1)" class="px-2.5 py-1 cursor-pointer hover:bg-stone-200 rounded-r-lg"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                    <span class="px-2.5 text-xs font-extrabold">${item.quantity}</span>
                                    <button onclick="updateQuantity(${item.id}, 1)" class="px-2.5 py-1 cursor-pointer hover:bg-stone-200 rounded-l-lg"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                </div>
                                <button onclick="updateQuantity(${item.id}, -${item.quantity})" class="text-rose-500 text-xs font-bold cursor-pointer hover:underline">حذف</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            subtotalEl.textContent = formatPrice(subtotal);
            totalEl.textContent = formatPrice(subtotal);
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            if (drawer) drawer.classList.toggle('hidden');
        }

        // 3. إرسال الطلب عبر البوت بالخلفية (Root-Cause Fixed: POST JSON بدون نوافذ، بدون تكرار، مع الأيقونات والصور)
        let isSubmittingOrder = false;

        async function submitOrderTelegram() {
            if (isSubmittingOrder || cart.length === 0) return;

            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            if (!phone || !address) {
                showToast("يرجى إدخال رقم الهاتف وعنوان التوصيل");
                return;
            }

            isSubmittingOrder = true;
            const btn = document.getElementById('submit-order-btn');
            const originalBtnHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i><span>جاري إرسال الطلب...</span>`;

            let subtotal = 0;
            let itemsText = "";
            let imagesText = "";

            cart.forEach((item, idx) => {
                subtotal += item.price * item.quantity;
                itemsText += `${idx + 1}. ${item.name} (الكمية: ${item.quantity}) - ${formatPrice(item.price * item.quantity)}\n`;
                imagesText += `🖼️ صورة المنتج (${item.name}):\n${item.image}\n\n`;
            });

            const msg = `🛒 طلب جديد من مجمع البسام\n\n📦 المنتجات المطلوبة:\n${itemsText}\n💰 المجموع الكلي: ${formatPrice(subtotal)}\n\n📍 معلومات التوصيل:\n📱 رقم الهاتف: ${phone}\n🏠 عنوان التوصيل: ${address}\n\n------------------\n🔗 روابط صور المنتجات:\n${imagesText}`;
            
            const botToken = "9166903671:AAF4hVWbwKRoOQlpf5EhxFcNw1GweL9xRZw";
            const chatId = "1291052441";
            const apiUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

            try {
                await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: msg
                    })
                });

                showToast("تم إرسال الطلب بنجاح عبر البوت!");
                document.getElementById('customer-phone').value = '';
                document.getElementById('customer-address').value = '';
                cart = [];
                updateCartUI();
                toggleCart();
            } catch (error) {
                showToast("حدث خطأ في الاتصال، حاول مرة أخرى");
            } finally {
                isSubmittingOrder = false;
                btn.disabled = false;
                btn.innerHTML = originalBtnHTML;
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('translate-y-32', 'opacity-0');
            t.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                t.classList.remove('translate-y-0', 'opacity-100');
                t.classList.add('translate-y-32', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
