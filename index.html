<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجمع البسام - المتجر الإلكتروني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eef6ff', 100: '#d9eaff', 500: '#0284c7', 600: '#0369a1', 750: '#0f172a', 800: '#0b1329', 900: '#060a17' },
                        gold: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' }
                    }
                }
            }
        }
    </script>
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-32 opacity-0 transition-all duration-300 bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700">
        <i id="toast-icon" class="text-emerald-400 text-lg"></i>
        <span id="toast-message" class="font-semibold text-sm"></span>
    </div>

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-sm border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-gradient-to-tr from-brand-750 to-brand-600 rounded-2xl flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                        <i class="fa-solid fa-store text-xl text-gold-400"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">مجمع البسام</h1>
                        <p class="text-xs text-slate-500 font-medium">المتجر الإلكتروني السحابي السريع</p>
                    </div>
                </div>

                <div class="hidden md:flex flex-1 max-w-md mx-8">
                    <div class="relative w-full">
                        <input type="text" id="desktop-search" oninput="handleSearch(this.value)" placeholder="ابحث عن منتج، جهاز، أو اكسسوار..." class="w-full bg-slate-100/80 border border-slate-200 rounded-xl py-2.5 pr-10 pl-4 text-sm focus:outline-none">
                        <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3.5 text-slate-400 text-sm"></i>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <button onclick="toggleCart()" class="relative bg-slate-100 hover:bg-slate-200 text-slate-700 p-3 rounded-xl transition-all flex items-center gap-2 group cursor-pointer">
                        <i class="fa-solid fa-cart-shopping text-lg group-hover:text-brand-600 transition-colors"></i>
                        <span class="hidden sm:inline font-semibold text-sm">السلة</span>
                        <span id="cart-counter" class="absolute -top-1.5 -right-1.5 bg-brand-600 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center border-2 border-white shadow-sm">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="products-section" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h3 class="text-2xl font-bold text-slate-900">أقسام المنتجات</h3>
                <p class="text-sm text-slate-500">تتحدث المنتجات سحابياً وفورياً</p>
            </div>

            <div class="flex items-center gap-2 overflow-x-auto pb-2 md:pb-0">
                <button onclick="filterCategory('الكل')" id="tab-الكل" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold transition-all bg-brand-600 text-white shadow-md whitespace-nowrap">الكل</button>
                <button onclick="filterCategory('إلكترونيات')" id="tab-إلكترونيات" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 whitespace-nowrap">الإلكترونيات</button>
                <button onclick="filterCategory('منزلية')" id="tab-منزلية" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 whitespace-nowrap">المنزلية</button>
                <button onclick="filterCategory('اكسسوارات')" id="tab-اكسسوارات" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold transition-all bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 whitespace-nowrap">الاكسسوارات</button>
            </div>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <div id="no-results" class="hidden text-center py-16">
            <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400 text-3xl">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <h4 class="text-lg font-bold text-slate-700">لم يتم العثور على منتجات</h4>
        </div>
    </main>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div id="cart-backdrop" onclick="toggleCart()" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
        <div class="absolute inset-y-0 left-0 max-w-full flex pl-10">
            <div id="cart-panel" class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-brand-50 text-brand-600 rounded-xl flex items-center justify-center font-bold">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-900">سلة المشتريات</h3>
                            <p class="text-xs text-slate-500" id="cart-items-count-text">0 منتجات</p>
                        </div>
                    </div>
                    <button onclick="toggleCart()" class="w-9 h-9 rounded-xl bg-slate-200/60 hover:bg-slate-200 text-slate-600 flex items-center justify-center cursor-pointer">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4 divide-y divide-slate-100"></div>

                <div id="checkout-form-section" class="px-6 py-4 bg-slate-50 border-t border-slate-100 space-y-3">
                    <h4 class="text-sm font-bold text-slate-900 mb-2"><i class="fa-solid fa-truck-fast text-brand-600 ml-1"></i> معلومات التوصيل</h4>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">رقم الهاتف</label>
                        <input type="tel" id="customer-phone" placeholder="رقم الهاتف" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">عنوان التوصيل (محافظة، منطقة)</label>
                        <input type="text" id="customer-address" placeholder="مثال: بغداد، الكرادة" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none">
                    </div>
                </div>

                <div id="cart-footer" class="p-6 border-t border-slate-100 bg-slate-50 space-y-4">
                    <div class="space-y-2">
                        <div class="flex justify-between text-sm text-slate-600">
                            <span>المجموع الفرعي:</span>
                            <span id="cart-subtotal" class="font-semibold text-slate-900">0 د.ع</span>
                        </div>
                        <div class="flex justify-between text-sm text-slate-600">
                            <span>التوصيل:</span>
                            <span class="text-emerald-600 font-semibold">مجاني</span>
                        </div>
                        <div class="pt-2 border-t border-slate-200 flex justify-between text-base font-bold text-slate-900">
                            <span>المجموع الكلي:</span>
                            <span id="cart-total" class="text-brand-600 text-lg">0 د.ع</span>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <button onclick="submitOrderTelegram()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer">
                            <i class="fa-brands fa-telegram text-lg"></i>
                            <span>إرسال الطلب عبر بوت التليجرام (سحابي)</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 text-white pt-12 pb-8 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500">
            جميع الحقوق محفوظة &copy; 2026 مجمع البسام.
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            databaseURL: "https://albsam-store-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let products = JSON.parse(localStorage.getItem('al_bassam_cache_products')) || [
            { id: 101, name: "جهاز استريو منزلي متطور مع مكبرات صوت", category: "إلكترونيات", price: 175000, image: "https://images.unsplash.com/photo-1545454675-3531b543be5d?auto=format&fit=crop&w=600&q=80", status: "متوفر" },
            { id: 102, name: "ماكينة قهوة إسبريسو احترافية", category: "منزلية", price: 210000, image: "https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?auto=format&fit=crop&w=600&q=80", status: "متوفر" },
            { id: 103, name: "ساعة ذكية رياضية متطورة مقاومة للماء", category: "اكسسوارات", price: 65000, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80", status: "متوفر" },
            { id: 104, name: "مصباح إضاءة ليد ذكي ديكوري للمنزل", category: "منزلية", price: 35000, image: "https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?auto=format&fit=crop&w=600&q=80", status: "متوفر" },
            { id: 105, name: "مفرغة هواء وممسحة ذكية متعددة الاستخدام", category: "منزلية", price: 140000, image: "https://images.unsplash.com/photo-1558317374-067fb5f30001?auto=format&fit=crop&w=600&q=80", status: "متوفر" }
        ];
        
        let currentCategory = 'الكل';
        let searchQuery = '';
        let cart = [];

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();

            db.ref('products').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    products = Object.values(data);
                    localStorage.setItem('al_bassam_cache_products', JSON.stringify(products));
                    renderProducts();
                }
            });
            updateCartUI();
        });

        function formatPrice(price) { return Number(price).toLocaleString('en-US') + ' د.ع'; }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = (btn.id === `tab-${category}`) ? "tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold bg-brand-600 text-white whitespace-nowrap" : "tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap";
            });
            renderProducts();
        }

        function handleSearch(query) {
            searchQuery = query.trim().toLowerCase();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const noResults = document.getElementById('no-results');

            let filtered = products.filter(p => {
                const matchesCategory = (currentCategory === 'الكل' || p.category === currentCategory);
                const matchesSearch = p.name.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = filtered.map(product => {
                const isAvailable = product.status === 'متوفر' || !product.status;
                return `
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col overflow-hidden group">
                    <div class="relative bg-slate-100 h-56 overflow-hidden">
                        <img src="${product.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/600x400/f1f5f9/64748b?text=مجمع+البسام'">
                        <span class="absolute bottom-3 left-3 bg-white/90 text-slate-800 text-xs font-semibold px-2.5 py-1 rounded-lg">${product.category}</span>
                        <span class="absolute top-3 left-3 text-xs font-bold px-2.5 py-1 rounded-full ${isAvailable ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                            ${isAvailable ? 'متوفر' : 'غير متوفر'}
                        </span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <h4 class="font-bold text-slate-900 text-base mb-2 line-clamp-2">${product.name}</h4>
                        <div class="pt-4 border-t border-slate-100 flex items-center justify-between mt-4">
                            <span class="text-lg font-black text-brand-600">${formatPrice(product.price)}</span>
                            <button onclick="addToCart(${product.id})" ${!isAvailable ? 'disabled' : ''} class="${isAvailable ? 'bg-slate-900 hover:bg-brand-600 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed'} p-3 rounded-xl transition-all shadow-md">
                                <i class="fa-solid fa-cart-plus text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product || product.status === 'غير متوفر') return;
            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) existingItem.quantity += 1;
            else cart.push({ ...product, quantity: 1 });
            updateCartUI();
            showToast("تمت الإضافة للسلة");
        }

        function updateQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity <= 0) cart = cart.filter(i => i.id !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            const counter = document.getElementById('cart-counter');
            const countText = document.getElementById('cart-items-count-text');
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('cart-subtotal');
            const totalEl = document.getElementById('cart-total');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            counter.textContent = totalCount;
            if (countText) countText.textContent = `${totalCount} منتجات`;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-10">السلة فارغة</p>`;
                subtotalEl.textContent = formatPrice(0);
                totalEl.textContent = formatPrice(0);
                return;
            }

            let subtotal = 0;
            container.innerHTML = cart.map(item => {
                subtotal += item.price * item.quantity;
                return `
                    <div class="py-4 flex items-center gap-4">
                        <img src="${item.image}" class="w-16 h-16 object-cover rounded-xl bg-slate-100 flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <h5 class="font-bold text-slate-900 text-sm truncate">${item.name}</h5>
                            <p class="text-brand-600 font-bold text-sm">${formatPrice(item.price)}</p>
                            <div class="flex items-center gap-3 mt-2">
                                <div class="flex items-center border border-slate-200 rounded-lg bg-slate-50">
                                    <button onclick="updateQuantity(${item.id}, -1)" class="px-2 py-1 cursor-pointer"><i class="fa-solid fa-minus text-xs"></i></button>
                                    <span class="px-2 text-xs font-bold">${item.quantity}</span>
                                    <button onclick="updateQuantity(${item.id}, 1)" class="px-2 py-1 cursor-pointer"><i class="fa-solid fa-plus text-xs"></i></button>
                                </div>
                                <button onclick="updateQuantity(${item.id}, -${item.quantity})" class="text-rose-500 text-xs font-semibold cursor-pointer">حذف</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            subtotalEl.textContent = formatPrice(subtotal);
            totalEl.textContent = formatPrice(subtotal);
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            if (drawer) {
                drawer.classList.toggle('hidden');
            }
        }

        // إرسال الطلب عبر تخزين Firebase في الخلفية لكي يستقبله البوت
        async function submitOrderTelegram() {
            if (cart.length === 0) return;
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            if (!phone || !address) { showToast("أدخل رقم الهاتف وعنوان التوصيل"); return; }

            let subtotal = 0;
            let itemsList = [];

            cart.forEach(item => {
                subtotal += item.price * item.quantity;
                itemsList.push({
                    name: item.name,
                    price: item.price,
                    quantity: item.quantity,
                    image: item.image
                });
            });

            // تجهيز كائن الطلب لإرساله إلى سحابة Firebase
            const orderData = {
                id: Date.now(),
                phone: phone,
                address: address,
                items: itemsList,
                total: subtotal,
                date: new Date().toLocaleString('ar-IQ'),
                status: 'جديد'
            };

            try {
                // حفظ الطلب في قاعدة بيانات Firebase تحت قسم orders
                await db.ref('orders/' + orderData.id).set(orderData);
                
                // إرسال تنبيه مرئي للزبون
                showToast("تم إرسال الطلب بنجاح عبر السحابة للبوت!");
                toggleCart();
                cart = [];
                updateCartUI();
            } catch (error) {
                showToast("حدث خطأ، يجربة المحاولة مرة أخرى");
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('translate-y-32', 'opacity-0');
            t.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => { t.classList.remove('translate-y-0', 'opacity-100'); t.classList.add('translate-y-32', 'opacity-0'); }, 3000);
        }
    </script>
</body>
</html>
